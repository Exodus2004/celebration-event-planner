[project]
name = "celebration-event-planner-backend"
version = "1.0.0"
description = "GenAI-Powered Celebration & Event Planner Backend"
authors = [{ name = "Kiran Reddy" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "google-generativeai>=0.7.0",
    "python-dotenv>=1.0.0",
]

[tool.mypy]
python_version = "3.11"
strict = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
plugins = []

[[tool.mypy.overrides]]
module = [
    "google.generativeai",
    "google.generativeai.*",
    "google.ai.generativelanguage",
    "google.ai.generativelanguage.*",
]
ignore_missing_imports = true
ignore_errors = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --import-mode=importlib -W ignore::DeprecationWarning -W ignore::PendingDeprecationWarning"
testpaths = ["tests"]
pythonpath = ["."]
